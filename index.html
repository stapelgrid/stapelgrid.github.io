<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paletten-Stapel-Optimierer 14×22</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --muted:#94a3b8; --text:#e5e7eb;
    --line:#334155; --accent:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
    background:var(--bg); color:var(--text);
  }
  .wrap{max-width:1400px; margin:24px auto; padding:0 16px}
  h1{margin:0 0 12px; font-size:clamp(1.4rem,2.5vw,2.2rem)}
  p{color:var(--muted)}
  .grid{
    display:grid; grid-template-columns: 360px 1fr; gap:16px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .controls{
    display:grid; gap:10px;
  }
  label{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  input[type="number"]{
    width:90px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--line); background:#0b1220; color:var(--text);
  }
  input[type="checkbox"]{transform:scale(1.15)}
  button{
    padding:10px 14px; border-radius:10px; border:1px solid var(--line);
    background:#0b1220; color:var(--text); cursor:pointer;
  }
  button.primary{
    background:linear-gradient(180deg,#16a34a,#15803d);
    border-color:#15803d;
  }
  button:hover{filter:brightness(1.05)}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .stat{
    padding:10px; border:1px solid var(--line); border-radius:10px;
    background:#0b1220; margin-top:8px; font-size:.95rem;
  }
  canvas{
    width:100%; height:auto; background:#ffffff; border-radius:12px;
    border:1px solid var(--line);
  }
  .legend{
    display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:.9rem;
  }
  .sw{
    display:inline-block; width:14px; height:14px; border-radius:4px;
    margin-right:6px; vertical-align:middle;
  }
  @media (max-width: 980px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Paletten-Stapel-Optimierer</h1>
  <p>
    Optimiert eine möglichst dichte und stabile Belegung eines frei wählbaren Rasters
    mit asymmetrischer Anordnung, damit das Muster auf beiden Achsen gespiegelt und
    anschließend stabil gestapelt werden kann.
  </p>

  <div class="grid">
    <div class="card">
      <div class="controls">
        <label>Rasterbreite:
          <input id="gridW" type="number" min="1" max="100" value="22" style="width:70px">
        </label>

        <label>Rasterhöhe:
          <input id="gridH" type="number" min="1" max="100" value="14" style="width:70px">
        </label>

        <button id="applyGrid">Raster anwenden</button>

        <label>
          <input type="checkbox" id="shapeA" checked>
          Form A (2×1)
        </label>

        <label>
          <input type="checkbox" id="shapeB" checked>
          Form B (2×2)
        </label>

        <label>
          <input type="checkbox" id="shapeC" checked>
          Form C (3×2)
        </label>

        <label>
          Zufallsversuche:
          <input type="number" id="tries" min="50" max="5000" step="50" value="800">
        </label>

        <div class="row">
          <button class="primary" id="optimizeBtn">Optimieren</button>
          <button id="clearBtn">Leeren</button>
          <button id="downloadBtn">PNG speichern</button>
        </div>
      </div>

      <div class="stat" id="stats">
        Noch keine Optimierung durchgeführt.
      </div>

      <div class="legend">
        <span><span class="sw" style="background:#3b82f6"></span>2×1</span>
        <span><span class="sw" style="background:#f59e0b"></span>2×2</span>
        <span><span class="sw" style="background:#22c55e"></span>3×2</span>
      </div>
    </div>

    <div class="card">
      <canvas id="canvas" width="1000" height="700"></canvas>
    </div>
  </div>
</div>

<script>
let GRID_H = 14;
let GRID_W = 22;

const CELL = 32;
const PADDING = 20;

const SHAPES = [
  {
    id: 'A',
    name: '2×1',
    color: '#3b82f6',
    base: [2, 1]
  },
  {
    id: 'B',
    name: '2×2',
    color: '#f59e0b',
    base: [2, 2]
  },
  {
    id: 'C',
    name: '3×2',
    color: '#22c55e',
    base: [3, 2]
  }
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let bestSolution = null;

function getEnabledShapes() {
  const enabled = [];

  if (document.getElementById('shapeA').checked) {
    enabled.push(SHAPES[0]);
  }
  if (document.getElementById('shapeB').checked) {
    enabled.push(SHAPES[1]);
  }
  if (document.getElementById('shapeC').checked) {
    enabled.push(SHAPES[2]);
  }

  return enabled;
}

function getOrientations(shape) {
  const [w, h] = shape.base;

  if (w === h) {
    return [[w, h]];
  }

  return [
    [w, h],
    [h, w]
  ];
}

function createGrid() {
  return Array.from({ length: GRID_H }, () =>
    Array(GRID_W).fill(null)
  );
}

function canPlace(grid, x, y, w, h) {
  if (x + w > GRID_W || y + h > GRID_H) {
    return false;
  }

  for (let yy = y; yy < y + h; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      if (grid[yy][xx] !== null) {
        return false;
      }
    }
  }

  return true;
}

function place(grid, x, y, w, h, shape) {
  const id = Math.random().toString(36).slice(2, 9);

  for (let yy = y; yy < y + h; yy++) {
    for (let xx = x; xx < x + w; xx++) {
      grid[yy][xx] = {
        id,
        shape: shape.id,
        color: shape.color
      };
    }
  }

  return {
    id,
    x,
    y,
    w,
    h,
    shape: shape.id,
    color: shape.color,
    area: w * h
  };
}

function randomFill() {
  const enabledShapes = getEnabledShapes();

  if (enabledShapes.length === 0) {
    return null;
  }

  const grid = createGrid();
  const placements = [];

  const cells = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      cells.push([x, y]);
    }
  }

  shuffle(cells);

  for (const [x, y] of cells) {
    if (grid[y][x] !== null) {
      continue;
    }

    const candidates = [];

    for (const shape of enabledShapes) {
      for (const [w, h] of getOrientations(shape)) {
        if (canPlace(grid, x, y, w, h)) {
          candidates.push({ shape, w, h });
        }
      }
    }

    if (candidates.length === 0) {
      continue;
    }

    // Größere Steine leicht bevorzugen
    candidates.sort((a, b) => (b.w * b.h) - (a.w * a.h));

    // Mit etwas Zufall aus den besten Kandidaten wählen
    const top = candidates.slice(0, Math.min(3, candidates.length));
    const chosen = top[Math.floor(Math.random() * top.length)];

    placements.push(
      place(grid, x, y, chosen.w, chosen.h, chosen.shape)
    );
  }

  return {
    grid,
    placements
  };
}

function evaluate(solution) {
  if (!solution) {
    return -Infinity;
  }

  const { grid, placements } = solution;
  const totalCells = GRID_W * GRID_H;
  let filled = 0;

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== null) {
        filled++;
      }
    }
  }

  const fillRatio = filled / totalCells;

  // Asymmetrie gegenüber vertikaler und horizontaler Spiegelung
  let asymX = 0;
  let asymY = 0;

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const occupied = grid[y][x] !== null ? 1 : 0;

      const mirrorX = grid[y][GRID_W - 1 - x] !== null ? 1 : 0;
      const mirrorY = grid[GRID_H - 1 - y][x] !== null ? 1 : 0;

      if (occupied !== mirrorX) asymX++;
      if (occupied !== mirrorY) asymY++;
    }
  }

  const asymmetryScore = (asymX + asymY) / (2 * totalCells);

  // Stabilität: belohne viele vertikale Kontakte
  let support = 0;
  for (let y = 1; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] && grid[y - 1][x]) {
        support++;
      }
    }
  }

  // Fugenstrafe: lange horizontale und vertikale Linien
  let seams = 0;

  for (let y = 0; y < GRID_H; y++) {
    let run = 0;
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] === null) {
        run++;
      } else {
        if (run > 2) seams += run;
        run = 0;
      }
    }
    if (run > 2) seams += run;
  }

  const pieceCount = placements.length;

  const score =
    fillRatio * 10000 +
    asymmetryScore * 800 +
    support * 2 -
    seams * 3 +
    pieceCount * 0.1;

  return score;
}

function optimize() {
  const tries = parseInt(
    document.getElementById('tries').value || '800',
    10
  );

  let best = null;
  let bestScore = -Infinity;

  for (let i = 0; i < tries; i++) {
    const solution = randomFill();
    const score = evaluate(solution);

    if (score > bestScore) {
      bestScore = score;
      best = solution;
    }
  }

  bestSolution = best;
  draw();
  updateStats(best, bestScore);
}

function updateStats(solution, score) {
  const stats = document.getElementById('stats');

  if (!solution) {
    stats.textContent = 'Keine gültige Lösung.';
    return;
  }

  const total = GRID_W * GRID_H;
  const filled = solution.placements.reduce(
    (sum, p) => sum + p.area,
    0
  );

  const counts = {};
  for (const p of solution.placements) {
    counts[p.shape] = (counts[p.shape] || 0) + 1;
  }

  stats.innerHTML = `
    <strong>Score:</strong> ${score.toFixed(1)}<br>
    <strong>Raster:</strong> ${GRID_W} × ${GRID_H}<br>
    <strong>Belegte Zellen:</strong> ${filled} / ${total}
    (${(filled / total * 100).toFixed(2)}%)<br>
    <strong>Anzahl Steine:</strong> ${solution.placements.length}<br>
    <strong>2×1:</strong> ${counts.A || 0},
    <strong>2×2:</strong> ${counts.B || 0},
    <strong>3×2:</strong> ${counts.C || 0}
  `;
}

function draw() {
  const width = GRID_W * CELL + PADDING * 2;
  const height = GRID_H * CELL + PADDING * 2;

  canvas.width = width;
  canvas.height = height;

  ctx.clearRect(0, 0, width, height);

  // Hintergrund
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);

  // Rasterlinien
  ctx.strokeStyle = '#d1d5db';
  ctx.lineWidth = 1;

  for (let x = 0; x <= GRID_W; x++) {
    ctx.beginPath();
    ctx.moveTo(PADDING + x * CELL, PADDING);
    ctx.lineTo(PADDING + x * CELL, PADDING + GRID_H * CELL);
    ctx.stroke();
  }

  for (let y = 0; y <= GRID_H; y++) {
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING + y * CELL);
    ctx.lineTo(PADDING + GRID_W * CELL, PADDING + y * CELL);
    ctx.stroke();
  }

  if (!bestSolution) {
    return;
  }

  // Steine zeichnen
  for (const p of bestSolution.placements) {
    const px = PADDING + p.x * CELL;
    const py = PADDING + p.y * CELL;

    ctx.fillStyle = p.color;
    ctx.fillRect(
      px + 1,
      py + 1,
      p.w * CELL - 2,
      p.h * CELL - 2
    );

    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2;
    ctx.strokeRect(
      px + 1,
      py + 1,
      p.w * CELL - 2,
      p.h * CELL - 2
    );
  }

  // Mittelachsen markieren
  ctx.save();
  ctx.strokeStyle = 'rgba(239,68,68,0.6)';
  ctx.setLineDash([6, 6]);

  // Vertikale Achse
  ctx.beginPath();
  ctx.moveTo(PADDING + GRID_W * CELL / 2, PADDING);
  ctx.lineTo(PADDING + GRID_W * CELL / 2, PADDING + GRID_H * CELL);
  ctx.stroke();

  // Horizontale Achse
  ctx.beginPath();
  ctx.moveTo(PADDING, PADDING + GRID_H * CELL / 2);
  ctx.lineTo(PADDING + GRID_W * CELL, PADDING + GRID_H * CELL / 2);
  ctx.stroke();

  ctx.restore();
}

function clearAll() {
  bestSolution = null;
  draw();
  document.getElementById('stats').textContent =
    'Raster geleert.';
}

function downloadPNG() {
  const link = document.createElement('a');
  link.download = 'paletten-stapel.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

document.getElementById('applyGrid').addEventListener('click', () => {
  const newW = Math.max(
    1,
    Math.min(
      100,
      parseInt(document.getElementById('gridW').value || '22', 10)
    )
  );

  const newH = Math.max(
    1,
    Math.min(
      100,
      parseInt(document.getElementById('gridH').value || '14', 10)
    )
  );

  GRID_W = newW;
  GRID_H = newH;

  bestSolution = null;
  draw();

  document.getElementById('stats').textContent =
    `Raster auf ${GRID_W} × ${GRID_H} gesetzt.`;
});

document
  .getElementById('optimizeBtn')
  .addEventListener('click', optimize);

document
  .getElementById('clearBtn')
  .addEventListener('click', clearAll);

document
  .getElementById('downloadBtn')
  .addEventListener('click', downloadPNG);

// Initiales leeres Raster
draw();
</script>
</body>
</html>
